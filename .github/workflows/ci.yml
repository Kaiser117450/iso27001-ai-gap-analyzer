name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python gap_analyzer.py examples/assessment_fnb.csv --org "Contoh Resto Nusantara" --out /tmp/report.md
